<!doctype html>

<html lang="zh-CN">

<style>
:root{color-scheme:dark;--bg:#0c121b;--panel:#131e2b;--line:#273548;--text:#e6edf6;--muted:#98a8bc;--blue:#90b8ff;--red:#ff939e;--green:#70d7be;--amber:#ecc58b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,input,select{font:inherit;color:inherit;background:#172334;border:1px solid var(--line);border-radius:7px;padding:9px 12px}button{cursor:pointer}button:hover{background:#243650}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:3px}button.active{background:#263e60;border-color:#7096ce;color:#c3d9ff}small,.muted{color:var(--muted);font-size:12px}header{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:38px;padding:0 30px}header strong{letter-spacing:.09em}header nav{display:flex;gap:26px;color:var(--muted)}header nav b{color:var(--blue)}.demo{margin-left:auto;color:var(--amber);font-size:12px;border:1px solid #5d4b35;padding:5px 9px;border-radius:5px}main{max-width:1500px;margin:auto;padding:34px 32px 120px}.heading{display:flex;align-items:center;justify-content:space-between;gap:20px}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--blue)}h1{font-size:30px;font-weight:600;letter-spacing:-.04em;margin:9px 0 12px}p{line-height:1.8}.heading p{color:var(--muted);margin:0}.tabs{display:flex;gap:8px;margin:28px 0 20px}.tabs button{border:0;background:transparent;padding:12px 18px}.tabs button.active{background:#25364e}.scope{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:19px 22px}.scope-top{display:flex;justify-content:space-between;gap:20px;align-items:center}.pills{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.pills>span{color:var(--muted);margin-right:9px}.rule{margin-top:15px;padding-top:15px;border-top:1px solid var(--line);display:flex;gap:22px;align-items:center;flex-wrap:wrap}.rule strong{color:var(--blue);font:600 18px ui-monospace,SFMono-Regular,monospace}.rule input{width:92px}.rule small{margin-left:auto}.summary{display:flex;gap:0;border-bottom:1px solid var(--line);padding:22px 0;margin-bottom:20px}.summary>div{padding:0 28px;border-right:1px solid var(--line)}.summary>div:first-child{padding-left:0}.summary>div:last-child{border:0}.summary b{font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;margin-right:8px}.red{color:var(--red)}.green{color:var(--green)}.blue{color:var(--blue)}.filters{display:flex;gap:12px;align-items:center;margin-bottom:17px;flex-wrap:wrap}.filters input[type=search]{min-width:240px}.filters .muted{margin-left:auto}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px}table{border-collapse:collapse;width:100%;white-space:nowrap}th{font-weight:400;color:var(--muted);font-size:12px;background:#111c29;text-align:left;padding:15px 18px}td{border-top:1px solid var(--line);padding:18px}tbody tr:hover{background:#152234}td small{display:block;margin-top:6px}.pair{display:flex;align-items:center;gap:12px}.coin{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#273c55;color:#b8d3f8;font-size:12px;font-weight:600}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}.price{font-size:17px}.badge{display:inline-block;border-radius:4px;padding:4px 7px;background:#2d2431;color:var(--red);font-size:11px}.badge.ok{color:var(--green);background:#18302e}.badge.stale{color:var(--muted);background:#28313d}.quiet{border:0;background:transparent;padding:3px;color:var(--blue)}.note{font-size:12px;color:var(--muted);line-height:1.9;margin-top:16px}.switcher{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:8px;background:#e2eaf5;color:#172337;border:1px solid #fff;border-radius:12px;box-shadow:0 12px 45px #0008;z-index:3;white-space:nowrap}.switcher button{background:transparent;color:inherit;border:0}.switcher span{min-width:190px;text-align:center}.switcher small{color:#51627a}.matrix td{text-align:center;min-width:140px}.matrix th:not(:first-child){text-align:center}.matrix td:first-child{text-align:left}.matrix button{width:100%;background:none;border:0;padding:4px}.workspace{display:grid;grid-template-columns:1fr 340px;gap:22px}.alert-card{border:1px solid var(--line);border-left:3px solid var(--red);border-radius:8px;background:var(--panel);padding:20px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:20px}.alert-card h3{margin:0 0 7px}.side{border:1px solid var(--line);border-radius:9px;padding:22px;background:var(--panel)}.side p{font-size:13px}.timeline{border-left:1px solid #415370;padding-left:17px;margin-top:24px}.timeline p{margin:0 0 24px}.gold-strip{padding:18px 22px;border:1px solid #5c503d;background:#231f1b;border-radius:8px;margin-bottom:20px;color:var(--amber);display:flex;gap:20px;align-items:center;flex-wrap:wrap}.gold-strip small{color:#c1b49f}.empty{text-align:center;padding:60px;color:var(--muted)}dialog{color:var(--text);background:#111c29;border:1px solid var(--line);border-radius:14px;padding:28px;width:min(650px,calc(100vw - 32px));max-height:88vh;overflow:auto}dialog::backdrop{background:#020610b8}dialog h2{margin-top:0}.dialog-head{display:flex;justify-content:space-between;align-items:center}.hero-quote{background:#1a293c;border-radius:9px;padding:24px;margin:22px 0}.hero-quote strong{display:block;font-size:36px;margin:14px 0}.facts{display:grid;grid-template-columns:130px 1fr;gap:16px;font-size:13px}.facts dt{color:var(--muted)}.facts dd{margin:0;line-height:1.5}.setting{display:flex;align-items:center;justify-content:space-between;padding:17px 0;border-bottom:1px solid var(--line)}.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:22px}#toast{position:fixed;top:80px;right:24px;background:#d4e3f8;color:#19273a;padding:13px 20px;border-radius:8px;z-index:10;box-shadow:0 8px 25px #0005}label{cursor:pointer}input[type=checkbox]{accent-color:#83adf0}.demo-tools{display:flex;gap:7px;align-items:center;margin-top:22px;flex-wrap:wrap}.demo-tools button{font-size:12px;padding:7px 10px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:900px){header nav{display:none}.workspace{grid-template-columns:1fr}.summary{flex-wrap:wrap;gap:18px}.summary>div{padding:0 15px}.scope-top{align-items:flex-start;flex-direction:column}.heading{align-items:flex-start}.heading p{max-width:420px}.rule small{margin-left:0}}
@media(max-width:600px){main{padding:24px 16px 110px}header{padding:0 16px}.heading{flex-direction:column}h1{font-size:27px}.summary>div{width:42%;border:0;padding:0}.filters input[type=search]{min-width:0;width:100%}.scope{padding:16px}.alert-card{flex-wrap:wrap}.switcher{gap:2px;bottom:12px}.switcher span{min-width:175px}.facts{grid-template-columns:100px 1fr}}

.observe-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;margin-top:20px}.obs-panel{border:1px solid var(--line);background:#111b28;border-radius:10px;padding:22px;margin-bottom:20px}.obs-panel h2{font-size:17px;font-weight:500;margin:0 0 18px}.obs-legs{display:grid;grid-template-columns:1fr 160px 1fr;gap:18px;align-items:center}.obs-leg{background:#182739;border-radius:8px;padding:18px;min-width:0}.obs-leg select{width:100%;margin:10px 0 18px}.obs-leg strong{font-size:23px;font-weight:500;display:block;margin-bottom:8px}.obs-center{text-align:center}.obs-center strong{font:25px ui-monospace,monospace;display:block;margin:12px 0}.obs-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.obs-toolbar button{font-size:12px;padding:6px 10px}.obs-chart{width:100%;height:290px;display:block;margin-top:15px}.obs-stat{display:flex;justify-content:space-between;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}.obs-stat b{font:14px ui-monospace,monospace}.obs-table button{font-size:11px;padding:4px 7px}.obs-label{color:var(--amber);padding:8px 12px;background:#272219;border-radius:5px;font-size:12px}.obs-swatch{display:inline-block;width:16px;height:2px;vertical-align:middle;margin-right:6px}.obs-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px}.obs-panel .note{margin-bottom:0}.obs-price{font:15px ui-monospace,monospace}.obs-table td{padding:14px}.obs-table th{padding:13px 14px}.observe-layout aside{min-width:0}.observe-layout>div{min-width:0}.obs-toolbar input{max-width:100%}.obs-toolbar>div{min-width:0}.obs-history-readout{font:12px ui-monospace,monospace;min-height:20px;color:var(--blue)}
@media(max-width:1050px){.observe-layout{grid-template-columns:1fr}.observe-layout aside{display:grid;grid-template-columns:1fr 1fr;gap:15px}}
@media(max-width:700px){.obs-legs{grid-template-columns:1fr}.obs-center{display:flex;align-items:center;justify-content:space-between;gap:10px}.observe-layout aside{display:block}.obs-panel{padding:15px}.obs-banner{align-items:flex-start;flex-direction:column}}
</style>
<body>
<header><strong>GATE CROSSEX</strong><nav><span>交易终端</span><span>资金费率</span><span>价差监控</span><b>稳定币监控</b></nav><span class="demo">交互稿 · 全部为模拟数据</span></header>
<main>
 <div class="heading"><div><div class="eyebrow">STABLECOIN / PAIR SCANNER</div><h1>发现稳定币之间的折价</h1><p>直接扫描现货交易对。看清买入哪枚币、支付哪枚币，不强制折算成 USDT。</p></div><button id="settings">提醒设置 ↗</button></div>
 <div class="tabs"><button data-tab="stable" class="active">稳定币交易对</button><button data-tab="metal">黄金价差观察</button></div>
 <div id="stable-scope" class="scope"><div class="scope-top"><div class="pills"><span>支付币范围</span><button data-scope="both" class="active">USDT + USDC</button><button data-scope="USDT">仅 USDT</button><button data-scope="USDC">仅 USDC</button><button data-scope="all">全部美元稳定币</button></div><label><input id="reverse" type="checkbox" checked> 双向扫描</label></div><div class="rule"><span>每买入 1 枚币，支付少于 <strong id="rule-value">0.9900</strong> 枚报价币</span><small>只比较目标锚定 1 美元的资产 · 不含收益凭证</small></div></div>
 <div id="metal-tabs" class="pills" style="margin-bottom:16px" hidden><button data-metal="gold" class="active">黄金</button><button data-metal="silver">白银</button><button data-metal="oil">石油</button><select id="oil-type" aria-label="石油基准" hidden><option value="wti">WTI 原油</option><option value="brent">Brent 原油</option></select></div>
 <div id="gold-scope" class="gold-strip" hidden><b>PAXG 黄金基准</b><span class="mono">4,000.00 USDT / 盎司</span><small>演示参考值 · 4 家来源 · 低于基准 99% 标记相对折价</small></div>
 <div class="summary" id="summary"></div>
 <div class="filters"><input id="search" type="search" placeholder="搜索买入币、支付币或交易对" aria-label="搜索交易对"><select id="venue" aria-label="筛选交易所"><option value="all">全部交易所</option><option>Gate</option><option>Binance</option><option>OKX</option><option>Bybit</option><option>Kraken</option><option>Hyperliquid</option></select><label><input id="only" type="checkbox"> 只看折价</label><span class="muted" id="count"></span><button id="sort">价格 ↑</button></div>
 <div id="content"></div>
 <p class="note" id="explanation"></p>
 <div class="demo-tools"><small>演示情景</small><button data-scenario="initial">初始报价</button><button data-scenario="dip">模拟跌破</button><button data-scenario="recover">模拟恢复</button><button data-scenario="offline">模拟断线</button><span id="state" class="muted"></span></div>
</main>
<div class="switcher"><button id="prev" aria-label="上一个布局">←</button><span id="variant-label"></span><button id="next" aria-label="下一个布局">→</button></div>
<dialog id="detail"></dialog><dialog id="config"></dialog><div id="toast" role="status" hidden></div>
<script>
// 这些交易对与报价仅用于交互评审，不声明任何平台真实上市或发生折价。
const seed=[
 {id:'a',v:'Gate',b:'USDe',q:'USDT',bid:.9859,ask:.9862,size:2500,age:1},
 {id:'b',v:'Hyperliquid',b:'USDe',q:'USDC',bid:.9879,ask:.9883,size:6300,age:1},
 {id:'c',v:'Binance',b:'FDUSD',q:'USDT',bid:.9986,ask:.999,size:92000,age:2},
 {id:'d',v:'OKX',b:'USDC',q:'USDT',bid:.9996,ask:.9998,size:65000,age:1},
 {id:'e',v:'Bybit',b:'PYUSD',q:'USDT',bid:.999,ask:1.0002,size:22000,age:2},
 {id:'f',v:'Kraken',b:'DAI',q:'USDC',bid:.9992,ask:1.0004,size:17000,age:2},
 {id:'g',v:'Gate',b:'DAI',q:'USDe',bid:1.016,ask:1.017,size:4200,bidSize:3800,age:1},
 {id:'h',v:'Bybit',b:'USDe',q:'USDC',bid:.9868,ask:.987,size:9800,age:24},
 {id:'i',v:'Binance',b:'PAXG',q:'USDT',bid:3998,ask:4002,size:12,age:1,metal:'gold',units:1},
 {id:'j',v:'Gate',b:'XAUT',q:'USDT',bid:3948,ask:3952,size:8,age:1,metal:'gold',units:1},
 {id:'s1',v:'Gate',b:'SILVER-DEMO',q:'USDT',bid:29.4,ask:29.5,size:800,age:1,metal:'silver',units:1},
 {id:'s2',v:'Bybit',b:'SILVER-DEMO',q:'USDT',bid:29.96,ask:30.02,size:1200,age:1,metal:'silver',units:1},
 {id:'s3',v:'Kraken',b:'SILVER-DEMO',q:'USDT',bid:29.3,ask:29.4,size:600,age:24,metal:'silver',units:1},
 {id:'o1',v:'Gate',b:'WTI-DEMO',q:'USDT',bid:73.5,ask:73.8,size:500,age:1,metal:'wti',units:1},
 {id:'o2',v:'Hyperliquid',b:'WTI-DEMO',q:'USDT',bid:74.9,ask:75.1,size:900,age:1,metal:'wti',units:1},
 {id:'o3',v:'Bybit',b:'BRENT-DEMO',q:'USDT',bid:78.5,ask:78.8,size:400,age:1,metal:'brent',units:1},
 {id:'o4',v:'Kraken',b:'BRENT-DEMO',q:'USDT',bid:79.9,ask:80.1,size:700,age:24,metal:'brent',units:1}
].map(r=>({...r,bidSize:r.bidSize||r.size}));
const names={A:'交易对列表',B:'报价矩阵',C:'异常工作台'};
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!names[variant])variant='A';
let scope='both',tab='stable',metal='gold',oilType='wti',threshold=.99,seconds=30,notify=false,scenario='initial',ascending=true;
const $=s=>document.querySelector(s),money=n=>n.toLocaleString('en-US',{maximumFractionDigits:2}),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const commodityInfo={
 gold:{label:'黄金',reference:'PAXG 黄金基准',price:4000,unit:'金衡盎司',note:'黄金按每金衡盎司价格与 PAXG 演示基准比较。'},
 silver:{label:'白银',reference:'白银参考价 · 模拟基准',price:30,unit:'金衡盎司',note:'白银按每金衡盎司价格与独立白银参考价比较。SILVER-DEMO 是虚构演示资产，不代表平台存在对应现货市场。'},
 wti:{label:'WTI 原油',reference:'WTI 原油参考价 · 模拟基准',price:75,unit:'桶',note:'WTI-DEMO 为虚构的每份 1 桶报价，仅演示同油种、同产品口径的相对价格。真实接入需核实产品类型、合约月份、展期与报价币汇率；不与 Brent 混比，也不将期货或永续折价称为稳定币脱锚。'},
 brent:{label:'Brent 原油',reference:'Brent 原油参考价 · 模拟基准',price:80,unit:'桶',note:'BRENT-DEMO 为虚构的每份 1 桶报价，仅演示同油种、同产品口径的相对价格。真实接入需核实产品类型、合约月份、展期与报价币汇率；不与 WTI 混比，也不将期货或永续折价称为稳定币脱锚。'}
};
const selectedCommodity=()=>metal==='oil'?oilType:metal;
const isOil=r=>['wti','brent'].includes(r.metal);
const assetUnit=r=>isOil(r)?'份':'枚';
function rows(){let list=[];for(const original of seed){const r={...original};if(tab==='stable'?!!r.metal:r.metal!==selectedCommodity())continue;if(scenario==='dip'&&r.id==='c'){r.bid=.9848;r.ask=.9852}if(scenario==='recover'&&['a','b','h'].includes(r.id)){r.bid=.9994;r.ask=.9997}if(r.metal&&scenario==='dip'){r.ask=commodityInfo[r.metal].price*.985*r.units;r.bid=r.ask*.999}if(r.metal&&scenario==='recover'){r.ask=commodityInfo[r.metal].price*1.001*r.units;r.bid=r.ask*.999}if(scenario==='offline'&&(r.metal||r.v==='Hyperliquid'))r.age=45;list.push({...r,key:r.id,buy:r.b,pay:r.q,price:r.ask,amount:r.ask*r.size,inverse:false});if(!r.metal&&$('#reverse').checked)list.push({...r,key:r.id+'r',buy:r.q,pay:r.b,price:1/r.bid,amount:r.bidSize,inverse:true})}return list.map(r=>({...r,ratio:r.metal?r.price/r.units/commodityInfo[r.metal].price:r.price,stale:r.age>15})).map(r=>({...r,low:!r.stale&&r.ratio<threshold})).filter(r=>tab==='metal'||scope==='all'||(scope==='both'?['USDT','USDC'].includes(r.pay):r.pay===scope))}
function visible(){const search=$('#search').value.trim().toUpperCase();return rows().filter(r=>($('#venue').value==='all'||r.v===$('#venue').value)&&(!$('#only').checked||r.low)&&(!search||`${r.buy}/${r.pay} ${r.b}/${r.q}`.toUpperCase().includes(search))).sort((a,b)=>Number(a.stale)-Number(b.stale)||(ascending?a.ratio-b.ratio:b.ratio-a.ratio))}
function status(r){return r.stale?'<span class="badge stale">行情过期 · 暂停判断</span>':r.low?'<span class="badge">相对折价</span>':'<span class="badge ok">正常</span>'}
function pair(r){return `<div class="pair"><span class="coin">${r.buy.slice(0,2)}</span><div><b>${r.buy} <span class="muted">/ ${r.pay}</span></b><small>买 ${r.buy} · 付 ${r.pay}</small></div></div>`}
function price(r){return `<span class="mono price ${r.stale?'muted':r.low?'red':''}">${r.price.toFixed(4)}</span>`}
function table(list){return `<div class="table-wrap"><table><thead><tr><th>${tab==='metal'?'买入资产 / 支付币':'买入币 / 支付币'}</th><th>交易所 · 原始市场</th><th>${tab==='metal'&&metal==='oil'?'买入价 / 份':'买入价 / 枚'}</th><th>${tab==='metal'?'较'+commodityInfo[selectedCommodity()].label+'基准':'较 1∶1'} 偏离</th><th title="以支付币计价，仅统计当前最优一档，未含手续费。">当前价可买金额</th><th>状态</th><th></th></tr></thead><tbody>${list.map(r=>`<tr><td>${pair(r)}</td><td>${r.v}<small>${r.b}/${r.q} · ${r.inverse?'反向买入':'正向买入'}</small></td><td>${price(r)}<small>${r.pay}${r.stale?' · 旧报价':''}</small></td><td class="mono ${r.low?'red':'muted'}">${r.stale?'—':((r.ratio-1)*100).toFixed(2)+'%'}</td><td class="mono">${money(r.amount)}<small>${r.pay} · ${r.inverse?'原买一档':'卖一档'}</small></td><td>${status(r)}<small>${r.age} 秒前 · ${r.low?'待持续确认':'盘口快照'}</small></td><td><button class="quiet" data-detail="${r.key}">详情 ↗</button></td></tr>`).join('')}</tbody></table></div>`}
function matrix(list){const assets=[...new Set(list.map(r=>r.buy))],quotes=[...new Set(list.map(r=>r.pay))];return `<div class="table-wrap"><table class="matrix"><thead><tr><th>↓ 买入币 / 支付币 →</th>${quotes.map(q=>`<th>${q}</th>`).join('')}</tr></thead><tbody>${assets.map(a=>`<tr><td><b>${a}</b><small>每格为筛选范围内最低有效价</small></td>${quotes.map(q=>{const group=list.filter(r=>r.buy===a&&r.pay===q),r=group.filter(r=>!r.stale).sort((a,b)=>a.price-b.price)[0]||group[0];return `<td>${r?`<button data-detail="${r.key}">${price(r)}<small>${r.v} · ${r.stale?'过期':r.low?'相对折价':'正常'}</small></button>`:'<span class="muted">—</span>'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
function workbench(list){const alerts=list.filter(r=>r.low);return `<div class="workspace"><div>${alerts.length?alerts.map(r=>`<article class="alert-card"><div><h3>${r.buy} <span class="muted">← 用 ${r.pay} 买入</span></h3><small>${r.v} · ${r.b}/${r.q} · ${r.inverse?'反向买入':'正向买入'}</small></div><div>${price(r)}<small style="display:block;margin-top:6px">每${assetUnit(r)}支付 ${r.pay}</small></div><div class="red mono">${((1-r.ratio)*100).toFixed(2)}% 折价</div><button data-detail="${r.key}">检查报价 →</button></article>`).join(''):'<div class="empty">当前筛选下没有有效折价报价</div>'}<p class="note">${list.filter(r=>!r.low&&!r.stale).length} 个方向正常 · ${list.filter(r=>r.stale).length} 个方向过期。完整报价请切换列表或矩阵。</p></div><aside class="side"><h3>提醒规则</h3><p>价格低于 <b>${threshold.toFixed(4)}</b><br>连续满足 <b>${seconds} 秒</b><br>Bark：${notify?'演示开启':'关闭'}</p><p class="muted">相同市场的不同方向分别判断；同一异常事件只提醒一次。</p><div class="timeline"><p><b>发现折价</b><br><small>立即显示，不等待提醒计时。</small></p><p><b>确认持续</b><br><small>报价过期会中断计时。</small></p><p><b>发送提醒</b><br><small>原型不连接真实 Bark。</small></p></div></aside></div>`}
function renderLegacy(){const list=visible(),all=rows(),bad=all.filter(r=>r.low);$('#stable-scope').hidden=tab!=='stable';$('#gold-scope').hidden=tab!=='metal';$('#gold-scope').style.display=tab==='metal'?'flex':'none';$('#metal-tabs').hidden=tab!=='metal';$('#metal-tabs').style.display=tab==='metal'?'flex':'none';document.querySelectorAll('[data-metal]').forEach(b=>b.classList.toggle('active',b.dataset.metal===metal));const info=commodityInfo[selectedCommodity()];$('#oil-type').hidden=tab!=='metal'||metal!=='oil';$('#gold-scope b').textContent=info.reference;$('#gold-scope .mono').textContent=info.price.toLocaleString('en-US',{minimumFractionDigits:2})+' USDT / '+info.unit;$('h1').textContent=tab==='stable'?'发现稳定币之间的折价':'发现'+info.label+'的相对折价';$('.heading p').textContent=tab==='stable'?'直接扫描现货交易对。看清买入哪枚币、支付哪枚币，不强制折算成 USDT。':'按相同标的、计量单位与产品口径比较参考价。此页全部为模拟报价。';$('#rule-value').textContent=threshold.toFixed(4);$('#gold-scope small').textContent=`${metal==='gold'?'演示参考值 · 4 家来源':'仅演示 · 真实价格来源与上市市场待核实'} · 低于基准 ${(threshold*100).toFixed(2)}% 标记相对折价`;document.querySelectorAll('[data-scope]').forEach(b=>b.classList.toggle('active',b.dataset.scope===scope));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#summary').innerHTML=`<div><b>${all.length}</b><small>纳入扫描的买入方向</small></div><div><b class="red">${bad.length}</b><small>相对折价</small></div><div><b>${new Set(all.map(r=>r.v)).size} / 6</b><small>有演示市场的交易所</small></div><div><b class="muted">${all.filter(r=>r.stale).length}</b><small>过期，暂停判断</small></div>`;$('#count').textContent=`当前显示 ${list.length} 个方向`;$('#content').innerHTML=list.length?(variant==='A'?table(list):variant==='B'?matrix(list):workbench(list)):'<div class="empty">没有匹配的报价。可以调整支付币范围、交易所或搜索条件。</div>';$('#explanation').textContent=tab==='metal'?info.note:'相对折价表示买入 1 枚币需要支付更少的另一枚币，不等于已确定买入币脱锚。双向价格分别取卖一价与买一价倒数；不跨所合成汇率，不扣手续费。';$('#variant-label').innerHTML=`<small>布局 ${variant} / 3</small>　${names[variant]}`;$('#state').textContent=`${(tab==='metal'?{initial:'初始报价',dip:'商品跌破',recover:'商品恢复',offline:'商品行情断线'}:{initial:'初始报价',dip:'FDUSD 跌破',recover:'USDe 恢复',offline:'Hyperliquid 断线'})[scenario]} · ${tab==='metal'?info.label:scope==='all'?'全部美元稳定币':scope==='both'?'USDT + USDC':scope} · ${tab==='metal'?'仅正向':$('#reverse').checked?'双向':'仅正向'}`}
function detail(key){const r=rows().find(r=>r.key===key);if(!r)return;$('#detail').innerHTML=`<div class="dialog-head"><h2>${r.buy} / ${r.pay}</h2><button data-close="detail" aria-label="关闭详情">×</button></div><p class="muted">${r.v} · 模拟市场 · ${r.inverse?'反向买入':'正向买入'}</p><div class="hero-quote">买入 1 ${assetUnit(r)} ${r.buy}，支付<strong class="mono ${r.low?'red':''}">${r.price.toFixed(4)} <small>${r.pay}</small></strong>${status(r)}</div><dl class="facts"><dt>原始交易对</dt><dd>${r.b}/${r.q}</dd><dt>计算方式</dt><dd class="mono">${r.inverse?`1 ÷ 买一价 ${r.bid.toFixed(4)}`:`卖一价 ${r.ask.toFixed(4)}`} = ${r.price.toFixed(4)}</dd><dt>实际操作</dt><dd>${r.inverse?`卖出 ${r.b}，获得 ${r.q}；因此是用 ${r.b} 买 ${r.q}。`:`支付 ${r.q}，买入 ${r.b}。`}</dd><dt>该档容量</dt><dd>${money(r.amount)} ${r.pay} 可换约 ${money(r.amount/r.price)} ${r.buy}</dd><dt>异常判断</dt><dd>${r.metal?`每${assetUnit(r)}价格 ÷ ${r.units} ${commodityInfo[r.metal].unit}/${assetUnit(r)} ÷ ${commodityInfo[r.metal].reference} ${commodityInfo[r.metal].price} USDT/${commodityInfo[r.metal].unit}`:`每枚支付的 ${r.pay}`} &lt; ${threshold.toFixed(4)}${r.stale?'；本条行情已过期，不参与判断':''}</dd><dt>提醒</dt><dd>持续 ${seconds} 秒后提醒；此原型只展示交互，不实际计时或发送。</dd></dl><p class="note">${r.metal?commodityInfo[r.metal].note:"价格差可能来自买入币折价，也可能来自支付币溢价。仅凭这个交易对无法确定哪一枚偏离美元。"}</p>`;$('#detail').showModal()}
function settings(){$('#config').innerHTML=`<div class="dialog-head"><h2>提醒设置</h2><button data-close="config" aria-label="关闭设置">×</button></div><p class="muted">只修改当前演示，刷新后恢复默认值。</p><label class="setting">相对价格阈值<input id="threshold" type="number" min="0.01" max="1" step="0.0001" value="${threshold}" style="width:120px"></label><label class="setting">连续满足时间（秒）<input id="seconds" type="number" min="1" max="86400" value="${seconds}" style="width:120px"></label><label class="setting">Bark 手机提醒<input id="notify" type="checkbox" ${notify?'checked':''}></label><p class="note">稳定币按交易对比值判断；黄金按 PAXG 基准、白银按独立白银参考价，石油按各自 WTI / Brent 参考价判断。报价过期暂停判断，同一事件不重复提醒。</p><p id="validation" class="red" role="alert"></p><div class="actions"><button data-close="config">取消</button><button id="save" class="active">保存演示设置</button></div>`;$('#config').showModal()}

function render(){renderLegacy();const gold=tab==='metal';$('#metal-tabs').style.display='none';$('#gold-scope').style.display='none';$('#summary').hidden=gold;$('#summary').style.display=gold?'none':'flex';$('.filters').style.display=gold?'none':'flex';$('#settings').hidden=gold;$('.switcher').style.display=gold?'none':'flex';$('#explanation').hidden=gold;if(gold){$('.eyebrow').textContent='GOLD / SPREAD OBSERVATORY';$('h1').textContent='黄金价差观察';$('.heading p').textContent='沿用海力士的双腿与历史曲线交互，先观察各所报价、溢折价及其变化。';$('#content').innerHTML=goldObservation();$('#state').textContent='模拟情景 · 观察模式 · 无异常阈值'}else{$('.eyebrow').textContent='STABLECOIN / PAIR SCANNER'}}
function setLeg(which,id){if(which==='A'){if(id===legB)legB=legA;legA=id}else{if(id===legA)legA=legB;legB=id}render()}
 document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.setA)setLeg('A',b.dataset.setA);if(b.dataset.setB)setLeg('B',b.dataset.setB);if(b.id==='obs-swap'){[legA,legB]=[legB,legA];render()}if(b.dataset.window){windowHours=Number(b.dataset.window);render()}if(b.id==='obs-ma'){showMA=!showMA;render()}});
 document.addEventListener('change',e=>{if(e.target.id==='obs-A')setLeg('A',e.target.value);if(e.target.id==='obs-B')setLeg('B',e.target.value);if(e.target.id==='obs-type'){goldFilter=e.target.value;render()}if(e.target.id==='obs-search'){goldQuery=e.target.value;render()}});
 document.addEventListener('pointermove',e=>{const chart=e.target.closest('#obs-chart');if(!chart)return;const points=chart.querySelector('polyline').getAttribute('points').split(' '),box=chart.getBoundingClientRect(),i=Math.max(0,Math.min(120,Math.round(((e.clientX-box.left)/box.width*880-55)/760)));$('#obs-readout').textContent=`生成样本 ${i+1} / ${points.length} · 溢折价 ${pct(obsHoverPoints[i])} · 窗口 ${windowHours} 小时`});

render();
</script>
</body></html>
