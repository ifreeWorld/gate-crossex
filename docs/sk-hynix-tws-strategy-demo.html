  mask: var(--checkmark-image) center / 12px 12px no-repeat;

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;

}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:

}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);

}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;

  border: 0;

      color-mix(in srgb, var(--foreground) 7%, transparent),

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);

}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

    [aria-selected=&quot;true&quot;],

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {

.btn:focus-visible {

}

                &lt;tr&gt;&lt;td&gt;&lt;span class=&quot;sk-record-symbol&quot;&gt;&lt;strong id=&quot;sk-live-crypto-symbol&quot;&gt;SKHYNIXUSDT&lt;/strong&gt;&lt;small&gt;永续对冲腿&lt;/small&gt;&lt;/span&gt;&lt;/td&gt;&lt;td id=&quot;sk-live-crypto-venue&quot;&gt;OKX&lt;/td&gt;&lt;td id=&quot;sk-live-crypto-side&quot;&gt;卖出&lt;/td&gt;&lt;td id=&quot;sk-live-crypto-size&quot;&gt;8.000&lt;/td&gt;&lt;td&gt;保护限价&lt;/td&gt;&lt;td&gt;$124.91&lt;/td&gt;&lt;td id=&quot;sk-live-crypto-filled&quot;&gt;0.000&lt;/td&gt;&lt;td id=&quot;sk-live-crypto-status&quot;&gt;等待回报&lt;/td&gt;&lt;td&gt;EXEC-0817-A1&lt;/td&gt;&lt;td&gt;撤单&lt;/td&gt;&lt;/tr&gt;

              &lt;thead&gt;&lt;tr&gt;&lt;th&gt;成交时间&lt;/th&gt;&lt;th&gt;平台&lt;/th&gt;&lt;th&gt;合约&lt;/th&gt;&lt;th&gt;方向&lt;/th&gt;&lt;th&gt;成交数量&lt;/th&gt;&lt;th&gt;成交均价&lt;/th&gt;&lt;th&gt;成交金额&lt;/th&gt;&lt;th&gt;手续费&lt;/th&gt;&lt;th&gt;策略编号&lt;/th&gt;&lt;th&gt;成交编号&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
              &lt;tbody&gt;
                &lt;tr&gt;&lt;td&gt;2026-08-07 13:18:42&lt;/td&gt;&lt;td&gt;IBKR&lt;/td&gt;&lt;td&gt;000660 · KRX&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;sk-side-tag&quot;&gt;买入&lt;/span&gt;&lt;/td&gt;&lt;td&gt;8 股&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;sk-money-fx&quot; tabindex=&quot;0&quot; data-fx-formula=&quot;₩173,200 ÷ 1,389.83 USD/KRW = $124.62 USD&quot;&gt;$124.62&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;sk-money-fx&quot; tabindex=&quot;0&quot; data-fx-formula=&quot;₩1,385,600 ÷ 1,389.83 USD/KRW = $996.96 USD&quot;&gt;$996.96&lt;/span&gt;&lt;/td&gt;&lt;td&gt;$0.08&lt;/td&gt;&lt;td&gt;#SK-240817-01&lt;/td&gt;&lt;td&gt;IB-849201&lt;/td&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;td&gt;2026-08-07 13:18:42&lt;/td&gt;&lt;td&gt;OKX&lt;/td&gt;&lt;td&gt;SKHYNIXUSDT&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;sk-side-tag short&quot;&gt;卖出&lt;/span&gt;&lt;/td&gt;&lt;td&gt;8.000&lt;/td&gt;&lt;td&gt;$124.93&lt;/td&gt;&lt;td&gt;$999.44&lt;/td&gt;&lt;td&gt;$0.31&lt;/td&gt;&lt;td&gt;#SK-240817-01&lt;/td&gt;&lt;td&gt;OX-672105&lt;/td&gt;&lt;/tr&gt;

  &lt;div class=&quot;sk-hover-tooltip&quot; id=&quot;sk-fx-tooltip&quot; role=&quot;tooltip&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;sk-tws-prototype&#x27;);
      const openTab = root.querySelector(&#x27;#sk-open-tab&#x27;);
      const closeTab = root.querySelector(&#x27;#sk-close-tab&#x27;);
      const input = root.querySelector(&#x27;#sk-notional&#x27;);
      const openSize = root.querySelector(&#x27;#sk-open-size&#x27;);
      const closeSize = root.querySelector(&#x27;#sk-close-size&#x27;);
      const closeAll = root.querySelector(&#x27;#sk-close-all&#x27;);
      const closePartial = root.querySelector(&#x27;#sk-close-partial&#x27;);
      const closeManual = root.querySelector(&#x27;#sk-close-manual&#x27;);
      const closeSharesInput = root.querySelector(&#x27;#sk-close-shares&#x27;);
      const closeRemaining = root.querySelector(&#x27;#sk-close-remaining&#x27;);
      const rankNotional = root.querySelector(&#x27;#sk-rank-notional&#x27;);
      const horizon = root.querySelector(&#x27;#sk-horizon&#x27;);
      const perpSelect = root.querySelector(&#x27;#sk-perp-select&#x27;);
      const submit = root.querySelector(&#x27;#sk-submit&#x27;);
      const ibkrLane = root.querySelector(&#x27;#sk-ibkr-lane&#x27;);
      const cryptoLane = root.querySelector(&#x27;#sk-crypto-lane&#x27;);
      const recordTabs = root.querySelectorAll(&#x27;[data-record-tab]&#x27;);
      const recordPanels = root.querySelectorAll(&#x27;[data-record-panel]&#x27;);
      const orderCount = root.querySelector(&#x27;#sk-order-count&#x27;);
      const ordersEmpty = root.querySelector(&#x27;#sk-orders-empty&#x27;);
      const ordersLive = root.querySelector(&#x27;#sk-orders-live&#x27;);
      const fxTooltip = root.querySelector(&#x27;#sk-fx-tooltip&#x27;);
      const opportunities = [
        { id: &#x27;OKX&#x27;, venue: &#x27;OKX&#x27;, logo: &#x27;OX&#x27;, contract: &#x27;SKHYNIXUSDT&#x27;, bid: 124.93, ask: 125.08, fundingBps: 18.49, costsBps: 18, latency: 61 },
        { id: &#x27;GATE&#x27;, venue: &#x27;Gate&#x27;, logo: &#x27;GT&#x27;, contract: &#x27;SKHYNIXUSDT&#x27;, bid: 124.87, ask: 125.01, fundingBps: 16.82, costsBps: 16, latency: 74 },
        { id: &#x27;BYBIT&#x27;, venue: &#x27;Bybit&#x27;, logo: &#x27;BY&#x27;, contract: &#x27;SKHYUSDT&#x27;, bid: 124.84, ask: 124.99, fundingBps: 14.15, costsBps: 18, latency: 68 },
        { id: &#x27;BINANCE&#x27;, venue: &#x27;Binance&#x27;, logo: &#x27;BN&#x27;, contract: &#x27;SKHYNIXUSDT&#x27;, bid: 124.79, ask: 124.95, fundingBps: 11.04, costsBps: 18, latency: 57 },
        { id: &#x27;HYPERLIQUID&#x27;, venue: &#x27;Hyperliquid&#x27;, logo: &#x27;HL&#x27;, contract: &#x27;SKHY-PERP&#x27;, bid: 124.52, ask: 124.70, fundingBps: 9.21, costsBps: 12, latency: 43 }
      ];
      let currentOpportunity = opportunities[0];
      let mode = &#x27;open&#x27;;
      let closeKind = &#x27;all&#x27;;
      let closeRatio = 100;
      const strategyShares = 8;
      const usdKrw = 1389.83;
      const usdtUsd = 0.9998;
      const ibkrAskKrw = 173200;
      const ibkrBidKrw = 173005;
      const fxConversionCostBps = 3;
      let timers = [];

      const money = value =&gt; value.toLocaleString(&#x27;en-US&#x27;, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const won = value =&gt; Math.round(value).toLocaleString(&#x27;en-US&#x27;);
      const krwToUsdt = value =&gt; value / usdKrw / usdtUsd;
      const signed = (value, digits = 2) =&gt; `${value &gt;= 0 ? &#x27;+&#x27; : &#x27;&#x27;}${value.toFixed(digits)}`;
      const openingSpreadBps = opportunity =&gt; (opportunity.bid / krwToUsdt(ibkrAskKrw) - 1) * 10000;
      const strategyProfitBps = opportunity =&gt; openingSpreadBps(opportunity) + opportunity.fundingBps * Number(horizon.value) - opportunity.costsBps - fxConversionCostBps;
      const horizonLabel = () =&gt; horizon.value === &#x27;1&#x27; ? &#x27;8 小时&#x27; : horizon.value === &#x27;3&#x27; ? &#x27;24 小时&#x27; : &#x27;7 天&#x27;;
      const selectedCloseShares = () =&gt; {
        if (closeKind === &#x27;all&#x27;) return strategyShares;
        const value = Number(closeSharesInput.value);
        return Number.isInteger(value) &amp;&amp; value &gt;= 1 &amp;&amp; value &lt;= strategyShares ? value : null;
      };

      const updateClosePreview = () =&gt; {
        const shares = selectedCloseShares();
        if (shares === null) {
          closeRemaining.textContent = `请输入 1–${strategyShares} 的整数股数`;
          return;
        }
        closeRatio = shares / strategyShares * 100;
        const remaining = strategyShares - shares;
        closeRemaining.textContent = remaining === 0 ? &#x27;平仓后无剩余持仓&#x27; : `IBKR ${remaining} 股 · 永续 ${remaining.toFixed(3)}`;
        closeManual.querySelectorAll(&#x27;[data-close-ratio]&#x27;).forEach(button =&gt; {
          const shortcutShares = Math.max(1, Math.round(strategyShares * Number(button.dataset.closeRatio) / 100));
          button.setAttribute(&#x27;aria-pressed&#x27;, String(shortcutShares === shares));
        });
      };

      const showOrderCount = count =&gt; {
        orderCount.textContent = `(${count})`;
      };

      const clearLiveOrders = () =&gt; {
        showOrderCount(0);
        ordersEmpty.classList.remove(&#x27;sk-hidden&#x27;);
        ordersLive.classList.add(&#x27;sk-hidden&#x27;);
      };

      const showFxTooltip = target =&gt; {
        const rect = target.getBoundingClientRect();
        fxTooltip.textContent = `换算公式：${target.dataset.fxFormula}`;
        fxTooltip.style.left = `${Math.min(window.innerWidth - 170, Math.max(170, rect.left + rect.width / 2))}px`;
        fxTooltip.style.top = `${rect.top}px`;
        fxTooltip.classList.add(&#x27;visible&#x27;);
        fxTooltip.setAttribute(&#x27;aria-hidden&#x27;, &#x27;false&#x27;);
      };

      const hideFxTooltip = () =&gt; {
        fxTooltip.classList.remove(&#x27;visible&#x27;);
        fxTooltip.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
      };

      root.addEventListener(&#x27;mouseover&#x27;, event =&gt; {
        const target = event.target.closest?.(&#x27;[data-fx-formula]&#x27;);
        if (target) showFxTooltip(target);
      });
      root.addEventListener(&#x27;mouseout&#x27;, event =&gt; {
        const target = event.target.closest?.(&#x27;[data-fx-formula]&#x27;);
        if (target &amp;&amp; !target.contains(event.relatedTarget)) hideFxTooltip();
      });
      root.addEventListener(&#x27;focusin&#x27;, event =&gt; {
        const target = event.target.closest?.(&#x27;[data-fx-formula]&#x27;);
        if (target) showFxTooltip(target);
      });
      root.addEventListener(&#x27;focusout&#x27;, event =&gt; {
        if (event.target.closest?.(&#x27;[data-fx-formula]&#x27;)) hideFxTooltip();
      });

      const renderRanking = () =&gt; {
        const principal = Math.max(1, Number(rankNotional.value) || 1000);
        const ranked = [...opportunities].sort((left, right) =&gt; strategyProfitBps(right) - strategyProfitBps(left));
        const body = root.querySelector(&#x27;#sk-ranking-body&#x27;);
        body.innerHTML = ranked.map((opportunity, index) =&gt; {
          const spread = openingSpreadBps(opportunity);
          const profit = strategyProfitBps(opportunity);
          const dollars = principal * profit / 10000;
          const selected = opportunity.id === currentOpportunity.id;
          return `&lt;tr class=&quot;${selected ? &#x27;selected&#x27; : &#x27;&#x27;}&quot; data-id=&quot;${opportunity.id}&quot;&gt;
            &lt;td data-label=&quot;交易所&quot;&gt;&lt;div class=&quot;sk-rank-venue&quot;&gt;&lt;span class=&quot;sk-rank-number&quot;&gt;${index + 1}&lt;/span&gt;&lt;span&gt;${opportunity.venue}&lt;/span&gt;&lt;/div&gt;&lt;/td&gt;
            &lt;td data-label=&quot;永续合约&quot;&gt;&lt;div class=&quot;sk-rank-contract&quot;&gt;${opportunity.contract}&lt;/div&gt;&lt;/td&gt;
            &lt;td data-label=&quot;资金费率 / 8h&quot;&gt;&lt;span class=&quot;sk-rank-rate&quot;&gt;${signed(opportunity.fundingBps)} bps&lt;/span&gt;&lt;/td&gt;
            &lt;td data-label=&quot;IBKR Ask&quot;&gt;&lt;span class=&quot;sk-money-fx&quot; tabindex=&quot;0&quot; data-fx-formula=&quot;₩${won(ibkrAskKrw)} ÷ ${usdKrw.toLocaleString(&#x27;en-US&#x27;)} USD/KRW = $${(ibkrAskKrw / usdKrw).toFixed(2)} USD&quot;&gt;$${(ibkrAskKrw / usdKrw).toFixed(2)}&lt;/span&gt;&lt;/td&gt;
            &lt;td data-label=&quot;永续 Bid&quot;&gt;${opportunity.bid.toFixed(2)}&lt;/td&gt;
            &lt;td data-label=&quot;开仓价差&quot;&gt;&lt;span class=&quot;${spread &gt;= 0 ? &#x27;sk-positive&#x27; : &#x27;sk-negative&#x27;}&quot;&gt;${signed(spread, 1)} bps&lt;/span&gt;&lt;/td&gt;
            &lt;td data-label=&quot;预计策略收益&quot;&gt;&lt;div class=&quot;sk-rank-profit&quot;&gt;&lt;strong&gt;${signed(profit, 1)} bps&lt;/strong&gt;&lt;small&gt;${dollars &gt;= 0 ? &#x27;+&#x27; : &#x27;-&#x27;}$${money(Math.abs(dollars))}&lt;/small&gt;&lt;/div&gt;&lt;/td&gt;
            &lt;td&gt;&lt;button class=&quot;sk-rank-select&quot; data-select=&quot;${opportunity.id}&quot; aria-pressed=&quot;${selected}&quot; ${mode === &#x27;close&#x27; ? &#x27;disabled&#x27; : &#x27;&#x27;}&gt;${mode === &#x27;close&#x27; ? (selected ? &#x27;当前仓&#x27; : &#x27;—&#x27;) : (selected ? &#x27;已选&#x27; : &#x27;选中&#x27;)}&lt;/button&gt;&lt;/td&gt;
          &lt;/tr&gt;`;
        }).join(&#x27;&#x27;);
        body.querySelectorAll(&#x27;[data-select]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; selectOpportunity(button.dataset.select)));
      };

      const selectOpportunity = id =&gt; {
        const found = opportunities.find(opportunity =&gt; opportunity.id === id);
        if (!found) return;
        currentOpportunity = found;
        perpSelect.value = found.id;
        root.querySelector(&#x27;#sk-selected-logo&#x27;).textContent = found.logo;
        root.querySelector(&#x27;#sk-selected-venue&#x27;).textContent = `${found.venue} · SKHYNIX`;
        root.querySelector(&#x27;#sk-selected-bid&#x27;).textContent = found.bid.toFixed(2);
        root.querySelector(&#x27;#sk-selected-ask&#x27;).textContent = found.ask.toFixed(2);
        root.querySelector(&#x27;#sk-selected-fresh&#x27;).textContent = `${found.latency} ms`;
        root.querySelector(&#x27;#sk-funding-value&#x27;).textContent = `${signed(found.fundingBps)} bps`;
        root.querySelector(&#x27;#sk-funding-sub&#x27;).textContent = `每 8 小时 · 下一次 02:17:36`;
        root.querySelector(&#x27;#sk-crypto-lane-label&#x27;).textContent = `${found.venue} 永续`;
        root.querySelector(&#x27;#sk-close-crypto-label&#x27;).textContent = `${found.venue} · ${found.contract} 空头`;
        if (mode === &#x27;open&#x27;) input.value = Math.max(1, Number(rankNotional.value) || 1000);
        resetTrack();
        renderRanking();
        recalculate();
      };

      const resetTrack = () =&gt; {
        timers.forEach(clearTimeout);
        timers = [];
        ibkrLane.className = &#x27;sk-gate&#x27;;
        cryptoLane.className = &#x27;sk-gate&#x27;;
        root.querySelector(&#x27;#sk-ibkr-status&#x27;).textContent = &#x27;等待同时发送&#x27;;
        root.querySelector(&#x27;#sk-crypto-status&#x27;).textContent = &#x27;等待同时发送&#x27;;
        root.querySelector(&#x27;#sk-track-note&#x27;).textContent = &#x27;等待执行 · 不存在人工确认步骤&#x27;;
        root.querySelector(&#x27;#sk-track-result&#x27;).className = &#x27;sk-track-result&#x27;;
        root.querySelector(&#x27;#sk-result-value&#x27;).textContent = &#x27;未产生敞口&#x27;;
        const shares = selectedCloseShares();
        submit.disabled = mode === &#x27;close&#x27; &amp;&amp; shares === null;
        submit.textContent = mode === &#x27;open&#x27; ? &#x27;同时开仓&#x27; : shares === null ? &#x27;请输入有效股数&#x27; : shares === strategyShares ? &#x27;同时全部平仓&#x27; : `同时平仓 ${shares} 股`;
      };

      const recalculate = () =&gt; {
        const ibkrAskUsdt = krwToUsdt(ibkrAskKrw);
        const requested = Math.max(ibkrAskUsdt, Number(input.value) || 0);
        const closeShares = selectedCloseShares();
        if (mode === &#x27;close&#x27; &amp;&amp; closeShares === null) {
          root.querySelector(&#x27;#sk-ibkr-quantity&#x27;).textContent = &#x27;—&#x27;;
          root.querySelector(&#x27;#sk-crypto-quantity&#x27;).textContent = &#x27;—&#x27;;
          root.querySelector(&#x27;#sk-mismatch&#x27;).textContent = &#x27;等待有效股数&#x27;;
          return;
        }
        const shares = mode === &#x27;open&#x27; ? Math.max(1, Math.floor(requested / ibkrAskUsdt)) : closeShares;
        const ibKrwPrice = mode === &#x27;open&#x27; ? ibkrAskKrw : ibkrBidKrw;
        const ibPrice = krwToUsdt(ibKrwPrice);
        const cryptoPrice = mode === &#x27;open&#x27; ? currentOpportunity.bid : currentOpportunity.ask;
        const ibNotional = shares * ibPrice;
        const ibKrwNotional = shares * ibKrwPrice;
        const ibUsdNotional = ibKrwNotional / usdKrw;
        const cryptoNotional = shares * cryptoPrice;
        const mismatch = cryptoNotional - ibNotional;
        const mismatchPct = Math.abs(mismatch) / ibNotional * 100;
        root.querySelector(&#x27;#sk-ibkr-quantity&#x27;).innerHTML = `${shares} 股 · &lt;span class=&quot;sk-money-fx&quot; tabindex=&quot;0&quot; data-fx-formula=&quot;₩${won(ibKrwNotional)} ÷ ${usdKrw.toLocaleString(&#x27;en-US&#x27;)} USD/KRW = $${money(ibUsdNotional)} USD&quot;&gt;$${money(ibUsdNotional)} USD&lt;/span&gt; · ${money(ibNotional)} USDT`;
        root.querySelector(&#x27;#sk-crypto-quantity&#x27;).textContent = `${shares.toFixed(3)} · $${money(cryptoNotional)}`;
        root.querySelector(&#x27;#sk-mismatch&#x27;).textContent = `${mismatch &gt;= 0 ? &#x27;+&#x27; : &#x27;-&#x27;}$${money(Math.abs(mismatch))} · ${mismatchPct.toFixed(2)}%`;
        const remainingShares = mode === &#x27;open&#x27; ? shares : strategyShares - shares;
        const remainingKrw = remainingShares * ibKrwPrice;
        const remainingUsd = remainingKrw / usdKrw;
        root.querySelector(&#x27;#sk-fx-exposure&#x27;).innerHTML = remainingShares === 0 ? &#x27;$0.00 USD · 已解除&#x27; : `&lt;span class=&quot;sk-money-fx&quot; tabindex=&quot;0&quot; data-fx-formula=&quot;₩${won(remainingKrw)} ÷ ${usdKrw.toLocaleString(&#x27;en-US&#x27;)} USD/KRW = $${money(remainingUsd)} USD&quot;&gt;+$${money(remainingUsd)} USD&lt;/span&gt; · 未对冲`;
        const spreadBps = mode === &#x27;open&#x27; ? openingSpreadBps(currentOpportunity) : (krwToUsdt(ibkrBidKrw) / currentOpportunity.ask - 1) * 10000;
        const spread = root.querySelector(&#x27;#sk-spread-value&#x27;);
        spread.textContent = `${spreadBps &gt;= 0 ? &#x27;+&#x27; : &#x27;&#x27;}${spreadBps.toFixed(1)} bps`;
        spread.className = `sk-metric-value ${spreadBps &gt;= 0 ? &#x27;sk-positive&#x27; : &#x27;sk-negative&#x27;}`;
        if (mode === &#x27;open&#x27;) {
          const profit = ibNotional * strategyProfitBps(currentOpportunity) / 10000;
          root.querySelector(&#x27;#sk-net-value&#x27;).textContent = `${profit &gt;= 0 ? &#x27;+&#x27; : &#x27;-&#x27;}$${money(Math.abs(profit))}`;
        } else {
          root.querySelector(&#x27;#sk-net-value&#x27;).textContent = `-$${money(Math.abs(mismatch) + 1.50)}`;
        }
      };

      const setCloseKind = kind =&gt; {
        closeKind = kind;
        if (kind === &#x27;all&#x27;) closeSharesInput.value = strategyShares;
        if (kind === &#x27;partial&#x27; &amp;&amp; (!selectedCloseShares() || Number(closeSharesInput.value) &gt;= strategyShares)) closeSharesInput.value = Math.max(1, Math.floor(strategyShares / 2));
        closeAll.setAttribute(&#x27;aria-pressed&#x27;, String(kind === &#x27;all&#x27;));

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }

    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );

        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }

  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
